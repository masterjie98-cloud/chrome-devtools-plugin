<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Execution Core Benchmark</title>
    <style>
      :root {
        color: #172033;
        background: #f5f7fb;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        padding: 32px;
      }
      main {
        max-width: 760px;
        margin: 0 auto;
        padding: 24px;
        border: 1px solid #d9e0ec;
        border-radius: 14px;
        background: white;
      }
      form {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }
      label {
        display: grid;
        gap: 6px;
        font-size: 14px;
      }
      input,
      select,
      button {
        min-height: 36px;
        border: 1px solid #aeb9ca;
        border-radius: 8px;
        padding: 0 10px;
        background: white;
      }
      .actions {
        grid-column: 1 / -1;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      #drawer {
        margin-top: 20px;
        padding: 16px;
        border-left: 3px solid #4b7bec;
        background: #f3f7ff;
      }
      #synthetic-tree {
        height: 1px;
        overflow: hidden;
      }
      .synthetic-node {
        height: 1px;
      }
    </style>
  </head>
  <body>
    <main data-testid="benchmark-root">
      <h1>Execution Core Benchmark</h1>
      <p id="status" aria-live="polite">ready</p>
      <form id="benchmark-form">
        <label>
          姓名
          <input id="benchmark-name" name="name" autocomplete="off" />
        </label>
        <label>
          团队
          <input id="benchmark-team" name="team" autocomplete="off" />
        </label>
        <label>
          角色
          <select id="benchmark-role" name="role">
            <option value="">请选择</option>
            <option value="developer">开发</option>
            <option value="reviewer">审核</option>
          </select>
        </label>
        <label>
          备注
          <input id="benchmark-note" name="note" autocomplete="off" />
        </label>
        <label>
          临时凭证（仅用于审批边界回归）
          <input id="field-7" type="password" autocomplete="new-password" />
        </label>
        <div class="actions">
          <button id="open-drawer" type="button">打开抽屉</button>
          <button id="network-action" type="button">请求状态</button>
          <button id="submit-fixture" class="primary-action" type="submit">
            提交测试表单
          </button>
        </div>
      </form>
      <aside id="drawer" hidden aria-label="测试抽屉"></aside>
      <div id="synthetic-tree" aria-hidden="true"></div>
    </main>
    <script>
      const syntheticTree = document.querySelector("#synthetic-tree");
      const fragment = document.createDocumentFragment();
      for (let index = 0; index < 10000; index += 1) {
        const node = document.createElement("div");
        node.className = "synthetic-node";
        node.dataset.index = String(index);
        fragment.appendChild(node);
      }
      syntheticTree.appendChild(fragment);

      document.querySelector("#open-drawer").addEventListener("click", () => {
        const drawer = document.querySelector("#drawer");
        drawer.replaceChildren();
        const fragment = document.createDocumentFragment();
        for (let index = 0; index < 30; index += 1) {
          const item = document.createElement("button");
          item.type = "button";
          item.textContent = `抽屉操作 ${index + 1}`;
          fragment.appendChild(item);
        }
        drawer.appendChild(fragment);
        drawer.hidden = false;
        document.querySelector("#status").textContent = "drawer-open";
      });

      document.querySelector("#network-action").addEventListener("click", async () => {
        const response = await fetch("./benchmark-ping.json?source=execution-core");
        const data = await response.json();
        document.querySelector("#status").textContent = data.status;
      });

      document.querySelector("#benchmark-form").addEventListener("submit", (event) => {
        event.preventDefault();
        document.querySelector("#status").textContent = "submit-blocked-by-fixture";
      });
    </script>
  </body>
</html>
